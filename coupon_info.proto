syntax = "proto3";

package couponproto;

option go_package = "github.com/cibeiwanjia/ride-proto/coupon";

// CouponService 优惠券服务
service CouponService {
    // 创建分发任务（平台主动分发优惠券）
    rpc CreateDistributeTask(CreateDistributeTaskRequest) returns (CreateDistributeTaskResponse) {}
    // 执行分发任务
    rpc ExecuteDistributeTask(ExecuteDistributeTaskRequest) returns (ExecuteDistributeTaskResponse) {}
    // 用户领取优惠券
    rpc UserGetCoupon(UserGetCouponRequest) returns (UserGetCouponResponse) {}
}

// ========== 创建分发任务 ==========
message CreateDistributeTaskRequest {
    uint32 coupon_id = 1;      // 优惠券ID
    uint32 number = 2;         // 单次领取数量
    string task_tag = 3;        // 任务标签（用于识别任务批次）
    string task_target = 4;     // 分发目标手机号（多个用逗号分隔）
    int32 operator_id = 5;      // 操作人ID
    int64 plan_time = 6;        // 计划执行时间（Unix时间戳，0表示立即执行）
    uint32 app_tpl_id = 7;      // App推送模板ID
    uint32 sms_tpl_id = 8;      // 短信模板ID
}

message CreateDistributeTaskResponse {
    bool success = 1;           // 是否成功
    string message = 2;          // 返回消息
    uint64 task_id = 3;          // 任务ID
}

// ========== 执行分发任务 ==========
message ExecuteDistributeTaskRequest {
    uint64 task_id = 1;         // 任务ID
    int32 operator_id = 2;      // 操作人ID
}

message ExecuteDistributeTaskResponse {
    bool success = 1;           // 是否成功
    string message = 2;          // 返回消息
    uint32 success_count = 3;   // 成功分发数量
    uint32 failed_count = 4;    // 失败数量
    repeated string failed_phones = 5; // 失败的手机号列表
}

// ========== 用户领取优惠券 ==========
message UserGetCouponRequest {
    uint64 passenger_id = 1;    // 乘客ID
    uint32 coupon_id = 2;       // 优惠券ID
}

message UserGetCouponResponse {
    bool success = 1;           // 是否成功
    string message = 2;          // 返回消息
    UserCoupon user_coupon = 3;  // 用户优惠券信息
}

// ========== 用户优惠券信息 ==========
message UserCoupon {
    uint64 id = 1;               // 用户优惠券ID
    uint64 passenger_id = 2;     // 乘客ID
    uint32 coupon_id = 3;        // 优惠券ID
    uint32 status = 4;           // 状态：0-未使用 1-已使用 2-已过期
    int64 get_time = 5;          // 领取时间（Unix时间戳）
    int64 use_time = 6;          // 使用时间（Unix时间戳）
    int64 expire_time = 7;       // 过期时间（Unix时间戳）
    uint32 order_id = 8;        // 使用订单ID
    int64 create_time = 9;       // 创建时间（Unix时间戳）
    int64 update_time = 10;      // 更新时间（Unix时间戳）
    uint32 get_method = 11;     // 获取方式：0-平台分发 1-用户主动领取
}
