syntax = "proto3";

package driverProto;

option go_package = "./driver_service";

service DriverInfo {
  rpc GetDriverList(GetDriverListReq) returns (GetDriverListRes);
  rpc GetDriverById(GetDriverByIdReq) returns (GetDriverByIdRes);
  rpc GetAvailableDrivers(GetAvailableDriversReq) returns (GetAvailableDriversRes);
  rpc UpdateDrixverLocation(UpdateDriverLocationReq) returns (UpdateDriverLocationRes);
}

//更新位置服务,司机和乘客/目的地之间的距离
message UpdateDriverLocationReq {
  uint32 driver_id = 1;  // 司机ID
  double lat = 2;        // 当前位置纬度
  double lng = 3;        // 当前位置经度
  int32 status = 4;      // 司机状态（可选，0-空闲，1-服务中，2-下线）
}

message UpdateDriverLocationRes {
  bool success = 1;   // 是否成功
  string message = 2; // 结果消息
  int64 updated_at = 3; // 更新时间(时间戳)
}

// GetDriverListReq 获取司机列表请求
message GetDriverListReq {
  uint32 page = 1;      // 页码
  uint32 page_size = 2; // 每页数量
  int32 status = 3;     // 司机状态筛选（0-全部，1-空闲，2-服务中，3-下线）
}

// GetDriverListRes 获取司机列表响应
message GetDriverListRes {
  repeated DriverDetail drivers = 1; // 司机列表
  int32 total = 2;                 // 总数
}

// GetDriverByIdReq 根据 ID 获取司机信息请求
message GetDriverByIdReq {
  uint32 driver_id = 1;  // 司机 ID
}

// GetDriverByIdRes 根据 ID 获取司机信息响应
message GetDriverByIdRes {
  DriverDetail driver = 1;  // 司机信息
}

// GetAvailableDriversReq 获取可服务司机请求
message GetAvailableDriversReq {
  double lat = 1;     // 乘客位置纬度
  double lng = 2;     // 乘客位置经度
  double radius = 3;  // 搜索半径（公里）
  int32 car_type = 4; // 车型类型（0-不限，1-经济型，2-舒适型，3-豪华型）
}

// GetAvailableDriversRes 获取可服务司机响应
message GetAvailableDriversRes {
  repeated DriverDetail drivers = 1; // 可服务司机列表
  int32 count = 2;                 // 司机数量
}

// DriverDetail 司机详细信息
message DriverDetail {
  uint32 id = 1;              // 司机 ID
  string name = 2;            // 司机姓名
  string phone = 3;           // 手机号
  string license_no = 4;      // 驾驶证号
  string plate_no = 5;        // 车牌号
  int32 car_type = 6;         // 车型类型（1-经济型，2-舒适型，3-豪华型）
  string car_color = 7;       // 车辆颜色
  string car_brand = 8;       // 车辆品牌
  double lat = 9;             // 当前位置纬度
  double lng = 10;            // 当前位置经度
  int32 status = 11;          // 状态（0-空闲，1-服务中，2-下线）
  double service_score = 12;  // 服务评分
  int32 total_orders = 13;    // 总订单数
  int64 created_at = 14;      // 创建时间
  int64 updated_at = 15;      // 更新时间
}
