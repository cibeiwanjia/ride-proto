syntax = "proto3";

package notifyProto;

option go_package = "./driver_notify";

// 通知类型枚举
enum NotifyType {
  NOTIFY_TYPE_UNKNOWN = 0;    // 未知类型
  NOTIFY_TYPE_NEW_ORDER = 1;  // 新订单
  NOTIFY_TYPE_PAY_SUCCESS = 2;// 乘客付款
  NOTIFY_TYPE_ORDER_CANCEL = 3;// 订单取消
}

// 通知目标类型枚举
enum NotifyTarget {
  NOTIFY_TARGET_UNKNOWN = 0;  // 未知目标
  NOTIFY_TARGET_NEAR_DRIVER = 1; // 推给附近司机
  NOTIFY_TARGET_ASSIGN_DRIVER = 2; // 推给指定司机
}

// MQ传输的通知消息体
message NotifyMessage {
  NotifyType type = 1;                // 通知类型
  NotifyTarget target = 2;            // 目标类型
  string order_sn = 3;                // 订单编号
  uint32 user_id = 4;                 // 目标司机ID（指定司机时必填）
  string title = 5;                   // 通知标题
  string content = 6;                 // 通知内容
  map<string, string> extra = 7;      // 扩展字段（经纬度/金额等）
  int64 created_at = 8;               // 消息生成时间戳（毫秒）
}

// gRPC查询通知记录请求
message GetNotifyRecordReq {
  uint32 driver_id = 1;               // 司机ID
  uint32 page = 2;                    // 页码
  uint32 page_size = 3;               // 每页条数
}

// gRPC查询通知记录响应
message GetNotifyRecordRes {
  repeated NotifyRecord records = 1;  // 通知记录列表
  int32 total = 2;                    // 总条数
}

// 通知记录（落地数据库）
message NotifyRecord {
  uint32 id = 1;                      // 记录ID
  uint32 user_id = 2;                 // 司机ID
  string order_sn = 3;                // 订单编号
  NotifyType notify_type = 4;         // 通知类型
  string title = 5;                   // 通知标题
  string content = 6;                 // 通知内容
  int32 status = 7;                   // 发送状态：0-待发送 1-已发送 2-失败
  int64 sent_at = 8;                  // 实际发送时间戳（毫秒）
  int64 created_at = 9;               // 记录创建时间戳
}

// 推送通知请求
message PushNotifyReq {
  uint32 driver_id = 1;          // 目标司机ID
  NotifyType notify_type = 2;     // 通知类型
  string order_sn = 3;            // 订单编号
  string title = 4;               // 通知标题
  string content = 5;             // 通知内容
}

// 推送通知响应
message PushNotifyRes {
  bool success = 1;                // 是否推送成功
  string reason = 2;              // 失败原因
}
// 推送通知请求
message UpdateDriverLocationReq {
  uint32 driver_id = 1;          // 目标司机ID
  float lng = 3;                  // 经度
  float lat = 2;                  // 纬度
}

// 推送通知响应
message UpdateDriverLocationRes {
  bool success = 1;                // 是否推送成功
  string reason = 2;              // 失败原因
}
// 通知服务gRPC接口
service NotifyService {
  rpc GetNotifyRecord(GetNotifyRecordReq) returns (GetNotifyRecordRes);
  rpc PushToDriver(PushNotifyReq) returns (PushNotifyRes);
  rpc UpdateDriverLocation(UpdateDriverLocationReq) returns (UpdateDriverLocationRes);
  rpc CreateRideSharingOrder(CreateRideSharingOrderReq) returns (CreateRideSharingOrderRes);
  rpc GetDriverOrders(GetDriverOrdersReq) returns (GetDriverOrdersRes);
  rpc DriverAccept(DriverAcceptReq) returns (DriverAcceptRes);
}

// 创建顺风车预约单请求
message CreateRideSharingOrderReq {
  string order_sn = 1;          // 订单编号
  string start_address = 2;     // 起点地址
  double start_lat = 3;         // 起点纬度
  double start_lng = 4;         // 起点经度
  string end_address = 5;       // 终点地址
  double end_lat = 6;           // 终点纬度
  double end_lng = 7;           // 终点经度
  double price = 8;              // 价格
  int32 passengers = 9;          // 乘车人数
  int32 is_carpool = 10;         // 是否拼车
  double toll_fee = 11;          // 高速费
  int32 toll_fee_payer = 12;     // 高速费承担方
  string earliest_time = 13;     // 最早出发时间
  string latest_time = 14;       // 最晚出发时间
}

// 创建顺风车预约单响应
message CreateRideSharingOrderRes {
  bool success = 1;
  string message = 2;
}

// 司机订单请求
message GetDriverOrdersReq {
  uint32 driver_id = 1;
  uint32 page = 2;
  uint32 page_size = 3;
}

// 司机订单响应
message GetDriverOrdersRes {
  repeated DriverOrder orders = 1;
}

// 司机订单
message DriverOrder {
  string order_sn = 1;
  int32 order_type = 2;
  string title = 3;
  string content = 4;
  int32 status = 5;
  int32 passengers = 6;
  int32 is_carpool = 7;
}

// 司机接单请求
message DriverAcceptReq {
  uint32 driver_id = 1;
  string order_sn = 2;
}

// 司机接单响应
message DriverAcceptRes {
  bool success = 1;
  string message = 2;
}
