syntax = "proto3";

package messageProto;

option go_package = "github.com/cibeiwanjia/ride-proto/message";
// 消息结构
message Message {
  uint64 id = 1;
  int32 user_id = 2;
  string order_no = 3;
  string content = 4;
  string msg_type = 5;
  bool is_read = 6;
  string created_at = 7;
}
// 获取消息请求
message GetMessagesRequest {
  int32 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}
// 获取消息响应
message GetMessagesResponse {
  repeated Message messages = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
// 标记消息已读请求
message MarkAsReadRequest {
  uint64 msg_id = 1;
}
// 标记消息已读响应
message MarkAsReadResponse {
  bool success = 1;
  string message = 2;
}
// 消息服务接口
service MessageService {
  // 获取消息
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  // 标记消息已读
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);
}