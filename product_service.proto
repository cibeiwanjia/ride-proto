syntax = "proto3";

package productProto;

option go_package = "github.com/cibeiwanjia/ride-proto/product";

// ========== 商品管理接口 ==========

// 商品模型
message Product {
  uint32 id = 1;           // 商品ID
  string name = 2;        // 商品名称
  uint32 price = 3;       // 价格（分）
  string img_url = 4;     // 图片URL
  int32 stock = 5;        // 库存
  int32 status = 6;        // 状态：1-上架 0-下架
  string created_at = 7;   // 创建时间
  string updated_at = 8;   // 更新时间
}

// 添加商品请求
message CreateProductReq {
  string name = 1;      // 商品名称
  uint32 price = 2;     // 价格
  string img_url = 3;    // 图片URL
  int32 stock = 4;      // 库存
}

// 添加商品响应
message CreateProductRes {
  uint32 id = 1;        // 商品ID
  bool success = 2;      // 是否成功
  string message = 3;    // 消息
}

// 商品列表请求
message ProductListReq {
  int32 page = 1;       // 页码，默认1
  int32 page_size = 2;   // 每页数量，默认10
  string keyword = 3;    // 搜索关键字
  int32 status = 4;      // 状态筛选：1-上架 0-下架
}

// 商品列表响应
message ProductListRes {
  int32 total = 1;                  // 总数
  repeated Product products = 2;    // 商品列表
}

// 商品详情请求
message ProductDetailReq {
  uint32 id = 1;    // 商品ID
}

// 商品详情响应
message ProductDetailRes {
  Product product = 1;  // 商品信息
}

// 修改商品请求
message UpdateProductReq {
  uint32 id = 1;        // 商品ID
  string name = 2;       // 商品名称
  uint32 price = 3;      // 价格
  string img_url = 4;    // 图片URL
  int32 stock = 5;       // 库存
  int32 status = 6;      // 状态
}

// 修改商品响应
message UpdateProductRes {
  bool success = 1;     // 是否成功
  string message = 2;  // 消息
}

// 删除商品请求
message DeleteProductReq {
  uint32 id = 1;    // 商品ID
}

// 删除商品响应
message DeleteProductRes {
  bool success = 1;    // 是否成功
  string message = 2;  // 消息
}

// ========== 购物车接口（保留原有的）==========

// 购物车商品项
message CartItem {
  int64 user_id = 1;
  int64 product_id = 2;
  string product_name = 3;
  float price = 4;
  int64 quantity = 5;
  string img_url = 6;
}

// 添加购物车请求
message AddCartItemRequest {
  int64 user_id = 1;
  int64 product_id = 2;
  string good_name = 3;
  float price = 4;
  int64 quantity = 5;
}

// 添加购物车响应
message AddCartItemResponse {
  bool success = 1;
  string message = 2;
}

// 获取购物车列表请求
message GetCartListRequest {
  int64 user_id = 1;
}

// 获取购物车列表响应
message GetCartListResponse {
  repeated CartItem items = 1;
}

// 删除购物车商品请求
message RemoveCartItemRequest {
  int64 user_id = 1;
  int64 product_id = 2;
}

// 删除购物车商品响应
message RemoveCartItemResponse {
  bool success = 1;
  string message = 2;
}

// 清空购物车请求
message ClearCartRequest {
  int64 user_id = 1;
}

// 清空购物车响应
message ClearCartResponse {
  bool success = 1;
  string message = 2;
}

// ========== 服务定义 ==========

service ProductService {
  // 商品管理
  rpc CreateProduct(CreateProductReq) returns (CreateProductRes);
  rpc GetProductList(ProductListReq) returns (ProductListRes);
  rpc GetProductDetail(ProductDetailReq) returns (ProductDetailRes);
  rpc UpdateProduct(UpdateProductReq) returns (UpdateProductRes);
  rpc DeleteProduct(DeleteProductReq) returns (DeleteProductRes);

  // 购物车
  rpc AddCartItem(AddCartItemRequest) returns (AddCartItemResponse);
  rpc GetCartList(GetCartListRequest) returns (GetCartListResponse);
  rpc RemoveCartItem(RemoveCartItemRequest) returns (RemoveCartItemResponse);
  rpc ClearCart(ClearCartRequest) returns (ClearCartResponse);
}
